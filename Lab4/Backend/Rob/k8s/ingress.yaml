apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rob-delivery-ingress
  namespace: rob-delivery
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: api.your-domain.com # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rob-delivery-service
                port:
                  number: 80
  tls:
    - hosts:
        - api.your-domain.com
      secretName: rob-delivery-tls
